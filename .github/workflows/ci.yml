name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Test NothungCore
        working-directory: Packages/NothungCore
        run: swift test

      - name: Verify rule-pack conversion
        run: |
          ruby Tools/convert_tarnhelm_rules.rb \
            RulePacks/Tarnhelm-GPL-3.0/SOURCE-rules.md \
            "$RUNNER_TEMP/tarnhelm-complete.nothung.json" \
            "$RUNNER_TEMP/manifest.json" \
            cdf1fee3e6d47db4c8ec0aa64726ef51b8247422
          cmp "$RUNNER_TEMP/tarnhelm-complete.nothung.json" \
            RulePacks/Tarnhelm-GPL-3.0/tarnhelm-complete.nothung.json
          cmp "$RUNNER_TEMP/manifest.json" \
            RulePacks/Tarnhelm-GPL-3.0/MANIFEST.json

      - name: Validate Apple metadata
        run: |
          plutil -lint \
            iOS/Nothung.xcodeproj/project.pbxproj \
            iOS/NothungApp/Info.plist \
            iOS/NothungAction/Info.plist \
            iOS/NothungKeyboard/Info.plist \
            iOS/NothungApp/PrivacyInfo.xcprivacy \
            iOS/NothungAction/PrivacyInfo.xcprivacy \
            iOS/NothungKeyboard/PrivacyInfo.xcprivacy \
            iOS/NothungApp/Nothung.entitlements \
            iOS/NothungAction/NothungAction.entitlements \
            iOS/NothungKeyboard/NothungKeyboard.entitlements

      - name: Build iOS app and extensions
        run: |
          xcodebuild \
            -project iOS/Nothung.xcodeproj \
            -scheme Nothung \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NothungDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
