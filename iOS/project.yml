name: Nothung
options:
  bundleIdPrefix: dev.nothung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NothungCore:
    path: ../Packages/NothungCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nothung:
    type: application
    platform: iOS
    sources:
      - path: NothungApp
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
          - Info.plist
          - Nothung.entitlements
      - path: Shared
    resources:
      - path: NothungApp/Assets.xcassets
      - path: NothungApp/PrivacyInfo.xcprivacy
    info:
      path: NothungApp/Info.plist
    entitlements:
      path: NothungApp/Nothung.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NothungCore
      - target: NothungAction
        embed: true

  NothungAction:
    type: app-extension
    platform: iOS
    sources:
      - path: NothungAction
        excludes:
          - Assets.xcassets
          - Info.plist
          - NothungAction.entitlements
          - PrivacyInfo.xcprivacy
      - path: Shared
      - path: NothungApp/RedirectResolver.swift
    resources:
      - path: NothungAction/Assets.xcassets
      - path: NothungAction/PrivacyInfo.xcprivacy
    info:
      path: NothungAction/Info.plist
    entitlements:
      path: NothungAction/NothungAction.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.app.action
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ActionIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NothungCore

  NothungTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NothungTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nothung
      - package: NothungCore
