name: Nothung
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: dev.nothung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NothungCore:
    path: ../Packages/NothungCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nothung:
    type: application
    platform: iOS
    sources:
      - path: NothungApp
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
          - Info.plist
          - Nothung.entitlements
      - path: Shared
      - path: NothungApp/Assets.xcassets
        buildPhase: resources
      - path: NothungApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: NothungApp/AppShortcuts.xcstrings
        buildPhase: resources
    info:
      path: NothungApp/Info.plist
      properties:
        CFBundleDisplayName: Nothung
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: NothungApp/Nothung.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.nothung.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NothungCore
      - target: NothungAction
        embed: true
      - target: NothungKeyboard
        embed: true

  NothungAction:
    type: app-extension
    platform: iOS
    sources:
      - path: NothungAction
        excludes:
          - Assets.xcassets
          - Info.plist
          - NothungAction.entitlements
          - PrivacyInfo.xcprivacy
      - path: Shared
      - path: NothungApp/RedirectResolver.swift
      - path: NothungAction/Assets.xcassets
        buildPhase: resources
      - path: NothungAction/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: NothungAction/InfoPlist.xcstrings
        buildPhase: resources
    info:
      path: NothungAction/Info.plist
      properties:
        CFBundleDisplayName: Copy with Nothung
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionActionWantsFullScreenPresentation: false
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationUsesStrictMatching: true
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
    entitlements:
      path: NothungAction/NothungAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.nothung.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.app.action
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ActionIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NothungCore

  NothungKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: NothungKeyboard
        excludes:
          - Info.plist
          - NothungKeyboard.entitlements
          - PrivacyInfo.xcprivacy
      - path: Shared
      - path: NothungApp/RedirectResolver.swift
      - path: NothungKeyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: NothungKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Nothung
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: NothungKeyboard/NothungKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.nothung.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: NothungCore

  NothungTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NothungTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nothung.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nothung
      - package: NothungCore

schemes:
  Nothung:
    build:
      targets:
        Nothung: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: NothungTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
    management:
      shared: true
